version: "3"
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14250"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger

  xxx-service:
    build:
      context: ./xxx-service
    ports:
      - "8080:8080"
    environment:
      - OTEL_SERVICE_NAME=xxx-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - YYY_SERVICE_URL=http://yyy-service:8081
    depends_on:
      - otel-collector
      - yyy-service

  yyy-service:
    build:
      context: ./yyy-service
    ports:
      - "8081:8081"
    environment:
      - OTEL_SERVICE_NAME=yyy-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - otel-collector
