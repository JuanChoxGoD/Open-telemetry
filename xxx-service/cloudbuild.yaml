steps:
  # 1. Construir la imagen de xxx-service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/xxx-service:$COMMIT_SHA', '.']

  # 2. Hacer push de xxx-service a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/xxx-service:$COMMIT_SHA']

  # 3. Desplegar xxx-service en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'xxx-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/xxx-service:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=OTEL_SERVICE_NAME=xxx-service,OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.nr-data.net:4317,NEW_RELIC_LICENSE_KEY=${_NEW_RELIC_LICENSE_KEY},YYY_SERVICE_URL=https://yyy-service-URL'

images:
  - 'gcr.io/$PROJECT_ID/xxx-service:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
